services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mailer
      MYSQL_USER: mailer
      MYSQL_PASSWORD: mailer
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
